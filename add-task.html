<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Add Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="logo">
                <h1>Task<span>Flow</span></h1>
            </div>
            <nav class="main-nav">
                <a href="index.html">Dashboard</a>
                <a href="task-list.html">Task List</a>
                <a href="add-task.html" class="active">Add Task</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <main class="add-task-container">
            <div class="form-card">
                <h2>Create a New Task</h2>
                <p class="subtitle">Fill in the details below to add a new task to your workspace.</p>
                
                <form action="task-list.html" method="GET" class="task-form">
                    <div class="form-group">
                        <label for="title">Task Title</label>
                        <input type="text" id="title" name="title" required placeholder="e.g., Complete Project Presentation">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" required placeholder="Provide a brief description of what needs to be done..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dueDate">Due Date</label>
                            <input type="date" id="dueDate" name="dueDate" required>
                        </div>

                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <div class="select-wrapper">
                                <select id="priority" name="priority">
                                    <option value="High">🔥 High</option>
                                    <option value="Medium" selected>⭐ Medium</option>
                                    <option value="Low">🌱 Low</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create Task</button>
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
