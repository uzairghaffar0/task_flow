<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Add Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ── Navigation ──────────────────────────────────────── -->
        <nav style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; margin-bottom: 3rem; border-bottom: 1px solid var(--border-color);">
            <a href="index.html" class="brand" style="font-size: 1.5rem; font-weight: 800; text-decoration: none; color: var(--text-main);">✅ TaskFlow</a>
            <ul style="display: flex; list-style: none; gap: 2rem;">
                <li><a href="index.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500;">Dashboard</a></li>
                <li><a href="add-task.html" class="active" style="text-decoration: none; color: var(--primary-color); font-weight: 500;">Add Task</a></li>
                <li><a href="task-list.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500;">Task List</a></li>
                <li><a href="task-detail.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500;">Task Detail</a></li>
                <li><a href="about.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500;">About</a></li>
            </ul>
        </nav>

        <main class="add-task-container">
            <div class="form-card">
                <h2>Create a New Task</h2>
                <p class="subtitle">Fill in the details below to add a new task to your workspace.</p>
                
                <form action="task-list.html" method="GET" class="task-form">
                    <div class="form-group">
                        <label for="title">Task Title</label>
                        <input type="text" id="title" name="title" required placeholder="e.g., Complete Project Presentation">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" required placeholder="Provide a brief description of what needs to be done..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dueDate">Due Date</label>
                            <input type="date" id="dueDate" name="dueDate" required>
                        </div>

                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <div class="select-wrapper">
                                <select id="priority" name="priority">
                                    <option value="High">🔥 High</option>
                                    <option value="Medium" selected>⭐ Medium</option>
                                    <option value="Low">🌱 Low</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create Task</button>
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
